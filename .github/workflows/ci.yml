name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Generate
        run: go generate ./...

      - name: Check generated API
        run: git diff --exit-code internal/api/generated

      - name: Test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...
