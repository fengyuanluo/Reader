openapi: 3.0.3
info:
  title: Reader API
  version: 0.0.1
  description: OpenAPI-first API for the Reader Go Web service.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Check service health.
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /version:
    get:
      operationId: getVersion
      tags:
        - system
      summary: Get service version.
      responses:
        "200":
          description: Service version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      tags:
        - system
      summary: Download the OpenAPI document.
      responses:
        "200":
          description: OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  /book-sources:
    get:
      operationId: listBookSources
      tags:
        - bookSources
      summary: List book sources.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema:
            type: string
          description: Matches source name, group, URL, or comment.
        - name: group
          in: query
          schema:
            type: string
        - name: enabled
          in: query
          schema:
            type: boolean
        - name: enabledExplore
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Book source page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSourceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createBookSource
      tags:
        - bookSources
      summary: Create a book source.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookSource"
            examples:
              minimal:
                $ref: "#/components/examples/MinimalBookSource"
              complete:
                $ref: "#/components/examples/CompleteBookSource"
      responses:
        "201":
          description: Created book source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /book-sources/import:
    post:
      operationId: importBookSources
      tags:
        - bookSources
      summary: Import Legado-compatible book source JSON.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportBookSourcesRequest"
            examples:
              single:
                $ref: "#/components/examples/ImportSingleBookSource"
              array:
                $ref: "#/components/examples/ImportBookSourceArray"
              remote:
                $ref: "#/components/examples/ImportRemoteBookSourceURL"
              aggregate:
                $ref: "#/components/examples/ImportSourceUrlsAggregate"
      responses:
        "200":
          description: Import completed with itemized result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBookSourcesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /book-sources/{sourceId}:
    get:
      operationId: getBookSource
      tags:
        - bookSources
      summary: Get one book source.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Book source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateBookSource
      tags:
        - bookSources
      summary: Update one book source.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookSource"
      responses:
        "200":
          description: Updated book source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteBookSource
      tags:
        - bookSources
      summary: Delete one book source.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "204":
          description: Book source deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /book-sources/{sourceId}/enabled:
    patch:
      operationId: updateBookSourceEnabled
      tags:
        - bookSources
      summary: Enable or disable one book source for search.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnabledUpdate"
      responses:
        "200":
          description: Updated source summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSourceSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /book-sources/{sourceId}/explore-enabled:
    patch:
      operationId: updateBookSourceExploreEnabled
      tags:
        - bookSources
      summary: Enable or disable one book source for discovery.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnabledUpdate"
      responses:
        "200":
          description: Updated source summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSourceSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /book-sources/reorder:
    patch:
      operationId: reorderBookSources
      tags:
        - bookSources
      summary: Reorder book sources.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookSourceReorderRequest"
      responses:
        "200":
          description: Reordered sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSourceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /search:
    post:
      operationId: searchBooks
      tags:
        - webBook
      summary: Search books across one or more enabled sources.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            examples:
              singleSource:
                $ref: "#/components/examples/SearchSingleSource"
              multiSource:
                $ref: "#/components/examples/SearchMultiSource"
      responses:
        "200":
          description: Search results and source warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /discovery:
    post:
      operationId: discoverBooks
      tags:
        - webBook
      summary: Fetch discovery results from enabled discovery sources.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryRequest"
      responses:
        "200":
          description: Discovery results and source warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /books:
    get:
      operationId: listBooks
      tags:
        - books
      summary: List bookshelf books.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Book list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createBook
      tags:
        - books
      summary: Save a book to bookshelf.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Book"
            examples:
              fromSearch:
                $ref: "#/components/examples/BookFromSearch"
      responses:
        "201":
          description: Saved book.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /books/{bookId}:
    get:
      operationId: getBook
      tags:
        - books
      summary: Get a book by ID.
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Book record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteBook
      tags:
        - books
      summary: Delete a book.
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Book deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /books/{bookId}/refresh-info:
    post:
      operationId: refreshBookInfo
      tags:
        - books
      summary: Refresh book information from source.
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Refreshed book.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /books/{bookId}/refresh-toc:
    post:
      operationId: refreshBookToc
      tags:
        - books
      summary: Refresh chapter list from source.
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Refreshed chapters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /books/{bookId}/chapters:
    get:
      operationId: listBookChapters
      tags:
        - books
      summary: List chapter metadata for a book.
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chapter list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /books/{bookId}/chapters/{index}/content:
    get:
      operationId: getBookChapterContent
      tags:
        - books
      summary: Get a chapter content.
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Chapter content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterContentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /books/{bookId}/progress:
    put:
      operationId: updateBookProgress
      tags:
        - books
      summary: Save reading progress.
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookProgress"
      responses:
        "200":
          description: Progress updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /images/proxy:
    get:
      operationId: proxyImage
      tags:
        - books
      summary: Proxy a cover or chapter image through the Reader fetcher.
      description: Fetches an image URL with the same timeout, redirect, response-size and SSRF policy used by normal source fetching.
      security:
        - bearerAuth: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: Absolute image URL to fetch.
        - name: bookId
          in: query
          required: false
          schema:
            type: string
          description: Optional bookshelf book id for future book-scoped image caching.
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
          description: Optional source id used to resolve image decode context.
        - name: decodeMode
          in: query
          required: false
          schema:
            type: string
            enum:
              - cover
              - content
          description: Optional decode mode. `cover` uses `coverDecodeJs`; `content` uses `ruleContent.imageDecode`.
      responses:
        "200":
          description: Proxied image bytes.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Image fetch failed or was blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /replace-rules:
    get:
      operationId: listReplaceRules
      tags:
        - replaceRules
      summary: List replace rules.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Replace rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaceRuleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createReplaceRule
      tags:
        - replaceRules
      summary: Create replace rule.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRule"
            examples:
              plain:
                $ref: "#/components/examples/PlainReplaceRule"
              regex:
                $ref: "#/components/examples/RegexReplaceRule"
      responses:
        "201":
          description: Created replace rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaceRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /replace-rules/{ruleId}:
    put:
      operationId: updateReplaceRule
      tags:
        - replaceRules
      summary: Update replace rule.
      security:
        - bearerAuth: []
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRule"
      responses:
        "200":
          description: Updated replace rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaceRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteReplaceRule
      tags:
        - replaceRules
      summary: Delete replace rule.
      security:
        - bearerAuth: []
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Replace rule deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /replace-rules/test:
    post:
      operationId: testReplaceRule
      tags:
        - replaceRules
      summary: Test a replace rule against text.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRuleTestRequest"
      responses:
        "200":
          description: Replacement result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaceRuleTestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /debug/book-source:
    post:
      operationId: createDebugSession
      tags:
        - debug
      summary: Create a book source debug session.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebugSessionCreateRequest"
            examples:
              keyword:
                $ref: "#/components/examples/KeywordDebugSession"
      responses:
        "202":
          description: Debug session accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /debug/sessions/{sessionId}:
    get:
      operationId: getDebugSession
      tags:
        - debug
      summary: Get debug session state.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Debug session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: cancelDebugSession
      tags:
        - debug
      summary: Cancel debug session.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Debug session cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /debug/sessions/{sessionId}/events:
    get:
      operationId: streamDebugSessionEvents
      tags:
        - debug
      summary: Stream debug session events as server-sent events.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-sent debug events.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /check/book-sources:
    post:
      operationId: createBookSourceCheckTask
      tags:
        - check
      summary: Start an asynchronous book source check task.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckTaskCreateRequest"
      responses:
        "202":
          description: Check task accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /check/tasks/{taskId}:
    get:
      operationId: getCheckTask
      tags:
        - check
      summary: Get check task state.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Check task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: cancelCheckTask
      tags:
        - check
      summary: Cancel check task.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Check task cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /check/tasks/{taskId}/events:
    get:
      operationId: streamCheckTaskEvents
      tags:
        - check
      summary: Stream check task events as server-sent events.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-sent check events.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: validation_failed
            message: request body is invalid
            details:
              field: bookSourceUrl
            traceId: trace-example
    Unauthorized:
      description: Bearer token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: auth_required
            message: missing bearer token
            details: {}
            traceId: trace-example
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: source_not_found
            message: book source was not found
            details:
              sourceId: src_123
            traceId: trace-example
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal_error
            message: internal server error
            details: {}
            traceId: trace-example
  schemas:
    Error:
      type: object
      required:
        - code
        - message
        - traceId
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        traceId:
          type: string
    Trace:
      type: object
      required:
        - traceId
      properties:
        traceId:
          type: string
    PageMeta:
      type: object
